<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Address Verification Widget - Standalone Vanilla JS Demo</title>
  <meta name="description" content="A lightweight, zero-dependency address verification component written in Vanilla JavaScript and CSS.">
  
  <!-- Modern Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- Widget Styling -->
  <link rel="stylesheet" href="css/widget.css">

  <!-- Base Styling -->
  <link rel="stylesheet" href="css/base.css">

</head>
<body>

  <!-- Demo Header Outer -->
  <div class="demo-header-outer">
    <div class="demo-brand-area">
      <div class="demo-logo-box">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"></circle>
          <path d="M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10z" fill="#DC2626" stroke="none"></path>
          <circle cx="12" cy="12" r="2" fill="#FFFFFF"></circle>
        </svg>
      </div>
      <div class="demo-title-area">
        <h1>Address Verification</h1>
        <p>A standalone, embeddable component for verifying addresses.</p>
        <div class="demo-badges">
          <span class="demo-badge demo-badge-blue">Vanilla JS</span>
          <span class="demo-badge demo-badge-grey">No Dependencies</span>
        </div>
      </div>
    </div>

    <!-- Theme Toggle Top Right -->
    <button class="theme-toggle-btn" id="theme-toggle" type="button" aria-label="Toggle dark mode">
      <span id="theme-icon-container">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </span>
      <span id="theme-label">Dark Mode</span>
    </button>
  </div>

  <!-- Main Demo Content Grid -->
  <main>
    <!-- Left Column: Address Verification Widget Container -->
    <section>
      <div id="address-widget"></div>
    </section>

    <!-- Right Column: Widget Inspector Sidebar -->
    <aside>
      <div class="inspector-card">
        <div class="inspector-header">
          <span class="inspector-title">Widget Inspector</span>
          <div class="live-status">
            <div class="live-dot"></div>
            <span>Live</span>
          </div>
        </div>

        <!-- Inspector Tabs -->
        <div class="inspector-tabs">
          <button class="inspector-tab inspector-tab-active" id="tab-json" type="button">JSON State</button>
          <button class="inspector-tab" id="tab-events" type="button">Events Log</button>
        </div>

        <!-- Code Box View -->
        <div class="code-box-wrap" id="view-json">
          <button class="code-copy-btn" id="copy-json-btn" type="button" title="Copy JSON state">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
          </button>
          <pre class="json-inspector" id="json-display">{ "currentState": "initiation" }</pre>
        </div>

        <!-- Recent Events Section -->
        <div class="recent-events-section">
          <div class="events-header">
            <span class="events-title">Recent Events</span>
            <button class="clear-btn" id="clear-events-btn" type="button">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
              </svg>
              Clear
            </button>
          </div>
          <div class="event-list" id="event-list">
            <!-- Dynamically populated events -->
          </div>
        </div>
      </div>
    </aside>
  </main>

  <footer>
    Designed &amp; Built by Sharon A &bull; Standalone Address Verification Widget SDK
  </footer>

  <!-- Include Widget JavaScript -->
  <script src="js/widget.js"></script>

  <!-- Demo Page Initialization & Inspector Script -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const jsonDisplay = document.getElementById('json-display');
      const eventList   = document.getElementById('event-list');

      function logEvent(msg, type = 'blue', detail = '') {
        const item = document.createElement('div');
        item.className = `event-item event-item-${type}`;
        const time = new Date().toLocaleTimeString();
        item.innerHTML = `
          <span class="event-time">${time}</span>
          <span class="event-msg">${msg}</span>
          ${detail ? `<span class="event-detail">${detail}</span>` : ''}
        `;
        eventList.prepend(item);
      }

      // Initial events
      logEvent('Widget mounted in #address-widget', 'blue');
      logEvent('Ready for verification', 'green');

      // Instantiate AddressVerificationWidget
      const widget = new AddressVerificationWidget({
        containerId: 'address-widget',
        defaultCountry: 'NG',
        onStateChange: (state) => {
          updateInspector();
          if (state.currentState === 'loading') {
            logEvent('Verification started', 'red');
          }
        },
        onVerificationComplete: (result) => {
          updateInspector();
          if (result.verified) {
            logEvent('Address Verified Successfully', 'green', `Confidence: ${result.confidenceScore}%`);
          } else {
            logEvent('Address Could Not Be Verified', 'red', result.message || '');
          }
        }
      });

      // Update Inspector view
      function updateInspector() {
        const state = widget.getState();
        jsonDisplay.textContent = JSON.stringify(state, null, 2);
      }

      // Copy JSON button listener
      document.getElementById('copy-json-btn').addEventListener('click', () => {
        const text = jsonDisplay.textContent;
        navigator.clipboard.writeText(text).then(() => {
          const btn = document.getElementById('copy-json-btn');
          btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#10B981" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
          setTimeout(() => {
            btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>`;
          }, 1500);
        });
      });

      // Clear events listener
      document.getElementById('clear-events-btn').addEventListener('click', () => {
        eventList.innerHTML = '';
      });

      // Tab switcher listener
      const tabJson   = document.getElementById('tab-json');
      const tabEvents = document.getElementById('tab-events');
      const viewJson  = document.getElementById('view-json');

      tabJson.addEventListener('click', () => {
        tabJson.classList.add('inspector-tab-active');
        tabEvents.classList.remove('inspector-tab-active');
        viewJson.style.display = 'block';
      });

      tabEvents.addEventListener('click', () => {
        tabEvents.classList.add('inspector-tab-active');
        tabJson.classList.remove('inspector-tab-active');
        viewJson.style.display = 'none';
      });

      // Initial inspect update
      updateInspector();

      // Dark Mode Toggle
      const themeToggleBtn = document.getElementById('theme-toggle');
      const themeIconContainer = document.getElementById('theme-icon-container');
      const themeLabel = document.getElementById('theme-label');

      const moonSvg = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>`;
      const sunSvg  = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>`;

      let isDark = false;
      themeToggleBtn.addEventListener('click', () => {
        isDark = !isDark;
        if (isDark) {
          document.documentElement.setAttribute('data-theme', 'dark');
          themeIconContainer.innerHTML = sunSvg;
          themeLabel.textContent = 'Light Mode';
        } else {
          document.documentElement.removeAttribute('data-theme');
          themeIconContainer.innerHTML = moonSvg;
          themeLabel.textContent = 'Dark Mode';
        }
      });
    });
  </script>
</body>
</html>
